<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1e293b"/>
    </filter>
  </defs>
  <!-- Background sketch badge with hand-drawn tilt -->
  <g transform="rotate(-3 32 32)">
    <rect x="8" y="8" width="48" height="48" rx="6" fill="#0d9488" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
    <!-- Inner subtle paper border -->
    <rect x="11" y="11" width="42" height="42" rx="4" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.7"/>
    <!-- Brand Letters "PB" -->
    <text x="32" y="38" font-family="'Lora', 'Georgia', serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PB</text>
    <!-- Little bridge / book arc underneath -->
    <path d="M20 44 Q 32 40 44 44" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>